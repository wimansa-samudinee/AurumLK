name: Continuous Deployment

on:
  push:
    branches: [ main, master ]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Verify and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter aurumlk-backend db:generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build Backend
        run: pnpm --filter aurumlk-backend build

      - name: Build Frontend
        run: pnpm --filter aurumlk-frontend build

      # =========================================================================
      # DEPLOYMENT OPTIONS
      # Uncomment and configure ONE of the options below according to your hosting:
